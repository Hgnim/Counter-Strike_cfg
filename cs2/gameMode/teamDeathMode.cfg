//团队死亡竞赛，并且在出生点复活
mp_teammates_are_enemies 0 //参数为1时队友互相为敌人（机器人队友也会相互攻击）
mp_dm_teammode 1 //团队模式
mp_friendlyfire 1 //关闭/开启友军伤害
ff_damage_reduction_bullets 1 //子弹对队友造成的伤害倍数 （默认0.33）
ff_damage_reduction_grenade 1 //投掷物对队友造成的伤害倍数 （默认0.85）
ff_damage_reduction_grenade_self 1 //投掷物对自己造成伤害倍数 （默认1）
ff_damage_reduction_other 1 //除了子弹和投掷物之外对队友造成的伤害倍数（默认0.4）
mp_damage_vampiric_amount 1 //禁用/启用吸血模式，默认情况下可吸到200HP（即两倍血量上限）
mp_randomspawn 1
mp_roundtime 40
ff_damage_bullet_penetration 0
mp_death_drop_healthshot 1
ammo_item_limit_healthshot 10 //设置回血枪数量上限为x（默认4）

mp_restartgame 1