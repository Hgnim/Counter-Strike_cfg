mp_friendlyfire true //关闭/开启友军伤害
ff_damage_reduction_bullets 1 //子弹对队友造成的伤害倍数 （默认0.33）
ff_damage_reduction_grenade 1 //投掷物对队友造成的伤害倍数 （默认0.85）
ff_damage_reduction_grenade_self 1 //投掷物对自己造成伤害倍数 （默认1）
ff_damage_reduction_other 1 //除了子弹和投掷物之外对队友造成的伤害倍数（默认0.4）
mp_ct_default_secondary weapon_usp_silencer //CT默认手枪USP
sv_hegrenade_damage_multiplier 2.8 //高爆手雷伤害修正系数（默认1）
ff_damage_bullet_penetration 1 //打到队友的子弹不会/会再伤害到后面的队友（总是会伤害到后面的敌人）
mp_restartgame 1